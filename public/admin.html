<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administrator | Starling Translations</title>

    <link rel="stylesheet" href="admin.css">
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="login" class="login">

    <div class="box">

        <p class="eyebrow">
            STARLING TRANSLATIONS
        </p>

        <h1>
            Administrator
        </h1>

        <p class="login-note">
            Sign in to manage your novel library.
        </p>


        <form
            id="loginForm"
            autocomplete="on"
        >

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button type="submit">
                LOGIN
            </button>


            <p
                id="loginError"
                class="error"
            ></p>

        </form>


        <a href="/">
            ← Back to website
        </a>

    </div>

</section>



<!-- =====================================================
     ADMIN DASHBOARD
===================================================== -->

<section
    id="dashboard"
    hidden
>


    <!-- HEADER -->

    <header class="top">

        <a
            href="/"
            class="brand"
        >
            STARLING
            <span>TRANSLATIONS</span>
        </a>


        <div class="top-actions">

            <span id="welcome"></span>


            <a href="/">
                View Website
            </a>


            <button
                id="logout"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main>


        <!-- DASHBOARD HEADER -->

        <div class="dash-head">

            <div>

                <p class="eyebrow">
                    CONTENT MANAGEMENT
                </p>

                <h1>
                    Novel Library
                </h1>

            </div>


            <!-- ONLY ONE ADD NOVEL BUTTON -->

            <button
                id="add"
                type="button"
            >
                + ADD NOVEL
            </button>

        </div>



        <!-- =================================================
             NOVEL LIST

             JavaScript will load all novels here.
             There is NO second Add Novel button.
        ================================================== -->

        <div id="list"></div>


    </main>

</section>



<!-- =====================================================
     ADD / EDIT NOVEL MODAL
===================================================== -->

<div
    id="modal"
    class="modal"
    hidden
>


    <div class="modal-box">


        <!-- MODAL HEADER -->

        <div class="modal-head">

            <h2 id="modalTitle">
                Add Novel
            </h2>


            <button
                id="close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

        </div>



        <!-- =================================================
             NOVEL FORM
        ================================================== -->

        <form
            id="novelForm"
            enctype="multipart/form-data"
        >


            <!-- NOVEL ID -->

            <input
                type="hidden"
                id="novelId"
                name="id"
            >



            <!-- TITLE -->

            <label>

                Novel Title

                <input
                    name="title"
                    id="title"
                    required
                >

            </label>



            <!-- AUTHOR -->

            <label>

                Original Author

                <input
                    name="author"
                    id="author"
                >

            </label>



            <!-- GENRES -->

            <label>

                Genres

                <small>
                    comma separated
                </small>

                <input
                    name="genres"
                    id="genres"
                    placeholder="Romance, Drama, Fantasy"
                >

            </label>



            <!-- =================================================
                 STATUS
            ================================================== -->

            <label>

                Status

                <select
                    name="status"
                    id="status"
                >

                    <option value="Ongoing">
                        Ongoing
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Coming Soon">
                        Coming Soon
                    </option>

                    <option value="Hiatus">
                        Hiatus
                    </option>

                </select>

            </label>



            <!-- SYNOPSIS -->

            <label>

                Synopsis

                <textarea
                    name="synopsis"
                    id="synopsis"
                    rows="8"
                    placeholder="Enter the full synopsis..."
                ></textarea>

            </label>



            <!-- PATREON -->

            <label>

                Patreon URL

                <input
                    name="patreon_url"
                    id="patreon"
                    type="url"
                    placeholder="https://www.patreon.com/..."
                    required
                >

            </label>



            <!-- COVER -->

            <label>

                Cover Image

                <input
                    name="cover"
                    id="cover"
                    type="file"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                >

            </label>



            <p class="hint">
                Maximum cover size: 2 MB.
            </p>



            <!-- ERROR -->

            <p
                id="formError"
                class="error"
            ></p>



            <!-- SAVE -->

            <button
                class="save"
                type="submit"
            >
                SAVE NOVEL
            </button>


        </form>

    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="admin.js"></script>


</body>

                  </html>
