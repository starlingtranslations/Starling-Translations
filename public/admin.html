<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrator | Starling Translations</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login">
  <div class="box">
    <p class="eyebrow">STARLING TRANSLATIONS</p>
    <h1>Administrator</h1>
    <p class="login-note">Sign in to manage your novel library.</p>
    <form id="loginForm" autocomplete="on">
      <input id="username" name="username" placeholder="Username" required autocomplete="username">
      <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">LOGIN</button>
      <p id="loginError" class="error"></p>
    </form>
    <a href="/">← Back to website</a>
  </div>
</div>

<div id="dashboard" hidden>
  <header class="top">
    <a href="/" class="brand">STARLING <span>TRANSLATIONS</span></a>
    <div class="top-actions">
      <span id="welcome"></span>
      <a href="/">View Website</a>
      <button id="logout" type="button">Logout</button>
    </div>
  </header>

  <main>
    <div class="dash-head">
      <div>
        <p class="eyebrow">CONTENT MANAGEMENT</p>
        <h1>Novel Library</h1>
      </div>
      <button id="add" type="button">+ ADD NOVEL</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Add Novel</h2>
      <button id="close" type="button">×</button>
    </div>
    <form id="novelForm" enctype="multipart/form-data">
      <input type="hidden" id="novelId">
      <label>Novel Title<input name="title" id="title" required></label>
      <label>Original Author<input name="author" id="author"></label>
      <label>Genres <small>comma separated</small><input name="genres" id="genres" placeholder="Romance, Drama, Fantasy"></label>
      <label>Status
        <select name="status" id="status">
          <option>Ongoing</option>
          <option>Completed</option>
          <option>Hiatus</option>
        </select>
      </label>
      <label>Synopsis<textarea name="synopsis" id="synopsis" rows="6"></textarea></label>
      <label>Patreon URL<input name="patreon_url" id="patreon" type="url" placeholder="https://www.patreon.com/..." required></label>
      <label>Cover Image<input name="cover" id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
      <p class="hint">Maximum cover size: 2 MB.</p>
      <p id="formError" class="error"></p>
      <button class="save" type="submit">SAVE NOVEL</button>
    </form>
  </div>
</div>

<div id="chapterModal" class="modal" hidden>
  <div class="modal-box chapter-manager">
    <div class="modal-head">
      <div>
        <p class="eyebrow">CHAPTER MANAGEMENT</p>
        <h2 id="chapterModalTitle">Chapters</h2>
      </div>
      <button id="chapterClose" type="button">×</button>
    </div>

    <form id="chapterForm" class="chapter-form">
      <input type="hidden" id="chapterId">
      <input type="hidden" id="chapterNovelId">
      <label>Chapter Number<input id="chapterNumber" type="number" min="1" step="1" required placeholder="1"></label>
      <label>Chapter Title<input id="chapterTitle" required placeholder="Chapter 1"></label>
      <label>Patreon Link<input id="chapterPatreon" type="url" required placeholder="https://www.patreon.com/posts/..."></label>
      <p id="chapterFormError" class="error"></p>
      <div class="chapter-form-actions">
        <button class="save" type="submit" id="chapterSave">ADD CHAPTER</button>
        <button class="cancel-btn" type="button" id="chapterCancel" hidden>CANCEL EDIT</button>
      </div>
    </form>

    <div class="chapter-list-head">
      <h3>Chapters</h3>
      <span id="chapterCount">0 chapters</span>
    </div>
    <div id="chapterList" class="chapter-list"></div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
